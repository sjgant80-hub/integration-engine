name: gate
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: tests · the organ
        run: node engine.test.mjs
      - name: tests · the calibration
        run: node fold.test.mjs
      - name: the study — the findings must reproduce
        run: node study.mjs
      # pinned @v0.2 deliberately: the baseline in this repo postdates v0.1
      - name: witness · the organ
        uses: sjgant80-hub/witness@v0.2
        with:
          source: engine.mjs
          test: node engine.test.mjs
          cap: '400'
      - name: witness · the calibration
        uses: sjgant80-hub/witness@v0.2
        with:
          source: fold.mjs
          test: node fold.test.mjs
          cap: '400'
